<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.25" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crescimento" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="aba" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base: margem de 100px segue a grade de ícones do macOS e funciona bem no Windows -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#fundo)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#brilho)"/>

  <!-- Carteira -->
  <g filter="url(#sombra)">
    <path d="M292 372 L628 282 Q676 270 690 318 L706 372 Z" fill="url(#aba)"/>
    <rect x="244" y="356" width="536" height="392" rx="72" fill="#ffffff"/>
    <rect x="574" y="490" width="206" height="124" rx="62" fill="#e0e7ff"/>
    <circle cx="636" cy="552" r="27" fill="#6366f1"/>
  </g>

  <!-- Linha de crescimento -->
  <path d="M302 668 L382 594 L444 634 L528 528" fill="none" stroke="url(#crescimento)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M560 486 L494 508 L548 556 Z" fill="#4ade80" stroke="#4ade80" stroke-width="10" stroke-linejoin="round"/>
</svg>
