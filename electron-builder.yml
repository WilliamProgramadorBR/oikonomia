appId: br.com.williamsantos.projetofinanceiro
productName: Projeto Financeiro
copyright: Copyright © 2026 William Oliveira Dos Santos
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asar: true
compression: maximum

# Atualização automática: o app instalado consulta as Releases deste repositório (latest.yml).
publish:
  provider: github
  owner: WilliamProgramadorBR
  repo: oikonomia
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: Projeto-Financeiro-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Projeto Financeiro
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  uninstallDisplayName: Projeto Financeiro
  # Os dados (banco cifrado + chave) ficam em %APPDATA%; desinstalar não apaga nada.
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.icns
  category: public.app-category.finance
  artifactName: Projeto-Financeiro-${version}-${arch}.${ext}

dmg:
  title: Projeto Financeiro ${version}
